name: Feature request
description: Suggest a focused improvement to the public MVP.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user value
      description: Which user-visible problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and its scope.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and limitations
      description: How could it be verified, and what trade-offs are known?
