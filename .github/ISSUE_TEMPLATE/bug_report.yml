name: Bug report
description: Report a reproducible problem in the project.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, secrets, private workspace data, or exploitable vulnerability details. Use SECURITY.md for security reports."
  - type: textarea
    id: behavior
    attributes:
      label: User-visible behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest steps and exact command or endpoint.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: v0.1.0, Node 24, macOS/Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, identifiers, and private content.
