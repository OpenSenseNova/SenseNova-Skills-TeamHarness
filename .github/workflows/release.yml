name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix local-computer
      - run: npm run verify:public
      - run: sha256sum web/public/downloads/anc-local-computer.tgz > web/public/downloads/anc-local-computer.tgz.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            web/public/downloads/anc-local-computer.tgz \
            web/public/downloads/anc-local-computer.tgz.sha256
